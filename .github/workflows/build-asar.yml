name: Build app.asar

# Builds the portable Hermes Desktop bundle from an upstream tag and publishes
# it as a release asset. Clients (Linux/Windows) resolve updates from
# releases/latest, so no build machine or LAN service is involved.

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'upstream tag to pack (empty = newest stable vX.Y.Z)'
        required: false
        default: ''
      publish:
        description: 'publish a GitHub release'
        type: boolean
        default: true
  schedule:
    # Daily look for a new upstream 0.x release; probe skips the build when
    # that version is already published, so an idle day costs seconds only.
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Pick upstream tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: NousResearch/hermes-agent
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_TAG:-}" ]; then
            TAG="$REQUESTED_TAG"
          else
            # 0.x line only: upstream's calendar aliases (v2026.9.24 == 0.21.5)
            # match vX.Y.Z and win under sort -V, so pin the major.
            TAG=$(git ls-remote --tags "https://github.com/$UPSTREAM_REPO.git" 'refs/tags/v*' \
              | sed -e 's|.*refs/tags/||' -e 's|\^{}$||' \
              | grep -E '^v0\.[0-9]+\.[0-9]+$' | sort -uV | tail -1)
          fi
          [ -n "$TAG" ] || { echo "cannot resolve upstream tag" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "${REQUESTED_TAG:-}" ] && gh release view "asar-$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "asar-$TAG already published; nothing to build"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: probe
    if: needs.probe.outputs.build == 'true'
    # node-pty has no Linux prebuild: it compiles against the runner's glibc,
    # and a binary from a newer image fails to dlopen on older distros
    # ("GLIBC_2.42 not found"). ubuntu-22.04 (glibc 2.35) keeps the artifact
    # loadable from Debian 12 up.
    runs-on: ubuntu-22.04
    env:
      UPSTREAM_REPO: NousResearch/hermes-agent
    steps:
      - name: Checkout packing repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack
        run: |
          corepack enable
          echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> "$GITHUB_ENV"

      - name: Install native build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev libxext-dev

      - name: Clone upstream
        run: |
          git clone --filter=blob:none "https://github.com/$UPSTREAM_REPO.git" "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" log --oneline -1

      - name: Build app.asar
        env:
          WORKSPACE: ${{ runner.temp }}/hermes-agent
          ART: ${{ github.workspace }}/art
          UPSTREAM_TAG: ${{ needs.probe.outputs.tag }}
          RELEASE_SLUG: ${{ github.repository }}
        run: bash bin/build-hermes-desktop-asar.sh

      - name: Stage release assets
        id: stage
        run: |
          set -euo pipefail
          TAG=$(jq -r .upstreamTag art/*/manifest.json | head -1)
          REL="asar-$TAG"
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp "art/$TAG/app.asar" release/app.asar
          cp "art/$TAG/app.asar.unpacked.tar.gz" release/app.asar.unpacked.tar.gz
          cp "art/$TAG/manifest.json" release/manifest.json
          cp bin/install-hermes-desktop-linux.sh release/install-hermes-desktop-linux.sh
          ls -l release
          echo "sha256: $(sha256sum release/app.asar | cut -d' ' -f1)"
          # build/Release is the Linux binary CI compiled; prebuilds/win32-* are
          # the PE ones shipped for the Windows green build.
          PTY=$(find "art/$TAG/app.asar.unpacked" -path '*/build/Release/pty.node' | head -1)
          echo "pty.node glibc floor: $(objdump -T "$PTY" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          WINPTY=$(find "art/$TAG/app.asar.unpacked" -path '*prebuilds/win32-x64/conpty.node' | head -1)
          [ -n "$WINPTY" ] || { echo "win32 prebuilds missing from unpacked" >&2; exit 1; }
          echo "win32 prebuilds: $(du -sh "$(dirname "$WINPTY")" | cut -f1) ($(file -b "$WINPTY"))"

      - name: Publish release
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL: ${{ steps.stage.outputs.rel }}
        run: |
          set -euo pipefail
          if gh release view "$REL" >/dev/null 2>&1; then
            gh release upload "$REL" release/* --clobber
          else
            gh release create "$REL" release/* \
              --title "Hermes Desktop $REL" \
              --notes "app.asar built from $UPSTREAM_REPO $(jq -r .upstreamTag release/manifest.json) by GitHub Actions.

          Install (Linux, idempotent — re-run to update):
          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-hermes-desktop-linux.sh | bash
          \`\`\`"
          fi
          gh release edit "$REL" --latest

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-asar-${{ steps.stage.outputs.rel }}
          path: release/
          retention-days: 14
